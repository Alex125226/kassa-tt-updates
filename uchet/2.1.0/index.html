<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const money = n => r2(n).toLocaleString("ru-RU", {minimumFractionDigits:2, maximumFractionDigits:2});
const money0 = n => Math.round(+n || 0).toLocaleString("ru-RU");
const qtyf = n => (Math.round((+n || 0) * 1000) / 1000).toLocaleString("ru-RU", {maximumFractionDigits:3});
const pct = n => (isFinite(n) ? (Math.round(n * 10) / 10).toLocaleString("ru-RU", {minimumFractionDigits:1, maximumFractionDigits:1}) : "—") + "%";
const uid = p => p + "_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
function iso(d){ const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const dfmt = s => s ? s.slice(8,10) + "." + s.slice(5,7) + "." + s.slice(0,4) : "";
const num = v => { const n = parseFloat(String(v).replace(",", ".").replace(/\s/g, "")); return isFinite(n) ? n : 0; };

const TYPES = {
  receipt:  {name:"Поступление товаров", short:"Поступление", plural:"Поступления", pre:"ПТ"},
  transfer: {name:"Перемещение товаров", short:"Перемещение", plural:"Перемещения", pre:"ПМ"},
  sale:     {name:"Реализация за смену", short:"Продажа", plural:"Продажи (смены)", pre:"РЛ"},
  writeoff: {name:"Списание товаров", short:"Списание", plural:"Списания", pre:"СП"},
  inventory:{name:"Инвентаризация", short:"Инвентаризация", plural:"Инвентаризации", pre:"ИН"},
  payment:  {name:"Оплата поставщику", short:"Оплата", plural:"Оплаты поставщикам", pre:"ОП"},
};
const WO_REASONS = ["Порча / брак", "Истёк срок годности", "Разморозка", "Бой / утеря", "Прочее"];
const woReason = d => d.reason || WO_REASONS[0];
const COLS = ["items", "stores", "suppliers", "docs", "settings", "orgs", "accounts", "articles", "employees", "shifts", "owners"];

/* ---------- state ---------- */
const S = {items:[], stores:[], suppliers:[], docs:[], settings:[], orgs:[], accounts:[], articles:[], employees:[], shifts:[], owners:[]};
let mode = "loading", db = null, dl = null, canWrite = true, ver = 0, L = null, Lver = -1;
const loaded = new Set();
const ui = {
  view: "dash", from: addDays(today(), -29), to: today(),
  jSearch: "", jStore: "all", jSupp: "all", jFrom: "all", jTo: "all", jReason: "all", itemSearch: "", itemGroup: "all",
  stockMode: "qty", stockGroup: "all", stockStore: "all", stockSupp: "all", stockSearch: "", stockQty: "nonzero", stockQmin: "", stockQmax: "",
  salesBy: "store", salesStore: "all", abcStore: "all", abcBy: "sum",
  cardItem: "", cardStore: "all",
};
let edit = null;      // document or reference being edited in the modal
let lastTable = null; // {name, head, rows} for CSV export

const byId = (col, id) => S[col].find(x => x.id === id);
const storeName = id => byId("stores", id)?.name || "—";
const gkey = g => String(g || "Без группы").trim();
const markups = () => byId("settings", "markups")?.groups || {};
function markupOf(itemId){ const it = itemOf(itemId); if (!it) return null; const m = markups()[gkey(it.group)]; return m === undefined || m === null || m === "" ? null : +m; }
const suppName = id => byId("suppliers", id)?.name || "—";
const itemOf = id => byId("items", id);
const sortedStores = () => S.stores.slice().sort((a, b) => (a.kind === "warehouse" ? -1 : 0) - (b.kind === "warehouse" ? -1 : 0) || (a.name || "").localeCompare(b.name || "", "ru"));
const retail = () => sortedStores().filter(s => s.kind !== "warehouse");
const groups = () => [...new Set(S.items.map(i => i.group || "Без группы"))].sort((a, b) => a.localeCompare(b, "ru"));
const sortedItems = () => S.items.slice().sort((a, b) => (a.group || "").localeCompare(b.group || "", "ru") || (a.name || "").localeCompare(b.name || "", "ru"));

let rq = 0;
function bump(){ ver++; if (!rq) rq = requestAnimationFrame(() => { rq = 0; render(); }); }

let tt;
function toast(msg, kind){ const t = $("#toast"); t.textContent = msg; t.className = kind || ""; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3600); }

/* ---------- storage ---------- */
function writeErr(e){
  const c = e && e.code;
  if (c === "invalid_argument") { canWrite = false; bump(); return "Нет прав на изменение данных. Попросите владельца дать доступ «Участник» или выше."; }
  if (c === "quota_exceeded") return "База заполнена: " + (e.message || "лимит документов") + ". Удалите старые документы.";
  if (c === "resource_exhausted") return "Слишком много операций подряд. Подождите пару секунд и повторите.";
  return "Не удалось сохранить: " + (e && e.message || "ошибка связи") + ".";
}
async function put(col, obj){
  const {id, ...rest} = obj;
  if (mode === "db") { await db.collection(col).doc(id).set(JSON.parse(JSON.stringify(rest))); }
  else { const a = S[col]; const i = a.findIndex(x => x.id === id); if (i >= 0) a[i] = obj; else a.push(obj); bump(); }
}
async function del(col, id){
  if (mode === "db") await db.collection(col).doc(id).delete();
  else { S[col] = S[col].filter(x => x.id !== id); bump(); }
}

/* ---------- ledger (проведение) ---------- */
function ledger(){
  if (Lver === ver && L) return L;
  const docs = S.docs.filter(d => d.posted).slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.created || 0) - (b.created || 0));
  const stock = new Map(), net = new Map(), avg = new Map(), moves = [], supp = [];
  const K = (s, i) => s + "|" + i;
  const add = (s, i, q) => stock.set(K(s, i), (stock.get(K(s, i)) || 0) + q);
  const addNet = (i, q) => net.set(i, (net.get(i) || 0) + q);
  for (const d of docs) {
    const lines = Array.isArray(d.lines) ? d.lines.filter(l => l && l.item) : [];
    if (d.type === "receipt") {
      let sum = 0;
      for (const l of lines) {
        const q = +l.qty || 0, p = +l.price || 0, nq = Math.max(0, net.get(l.item) || 0), a = avg.get(l.item) || 0;

        moves.push({date:d.date, doc:d, type:"receipt", item:l.item, store:d.to, q, cost:q * p});

        moves.push({date:d.date, doc:d, type:d.type, item:l.item, store:d.from, q:-q, cost:-c, sum, cogs:c, src});
      }

const stockOf = (store, item) => ledger().stock.get(store + "|" + item) || 0;
const itemStockTotal = item => { let t = 0; for (const s of S.stores) t += stockOf(s.id, item); return t; };
const inPeriod = d => d >= ui.from && d <= ui.to;
function salesIn(storeFilter){

function nextNum(type){
  const pre = TYPES[type].pre; let max = 0;
  for (const d of S.docs) if (d.type === type) { const n = parseInt(String(d.num || "").split("-")[1], 10); if (n > max) max = n; }

function docTotal(d){
  if (d.type === "payment" || d.type === "expense" || d.type === "money") return +d.amount || 0;
  if (d.type === "payroll") return +d.total || (d.lines || []).reduce((t, l) => t + (+l.accrued || 0), 0);
  let t = 0;
  for (const l of d.lines || []) {
    if (!l.item) continue;
    if (d.type === "sale" && l.sum !== undefined && l.sum !== "") t += +l.sum;
    else if (d.type === "receipt" || d.type === "sale") t += (+l.qty || 0) * (+l.price || 0);
    else if (d.type === "inventory") t += num(l.fact) * (itemOf(l.item)?.price || 0);
    else t += (+l.qty || 0) * (itemOf(l.item)?.price || 0);

}
function docRoute(d){
  if (d.type === "receipt") return "→ " + storeName(d.to);
  if (d.type === "transfer") return storeName(d.from) + " → " + storeName(d.to);
  if (d.type === "payment") return d.account ? accName(d.account) : "";
  if (d.type === "expense") return (byId("articles", d.article)?.name || "—") + " · " + (d.store ? storeName(d.store) : "общий");
  if (d.type === "money") return d.op === "transfer" ? accName(d.accFrom) + " → " + accName(d.accTo) : (d.source || "") + " → " + accName(d.accTo);
  if (d.type === "writeoff") return storeName(d.from) + " · " + woReason(d);
  if (d.type === "payroll") return monthName(d.month || "") + " · " + (d.lines || []).length + " сотр.";

}

  let debt = 0; for (const v of debtNow().values()) debt += v;

  const byDay = new Map(); for (let i = 0; i < days; i++) byDay.set(addDays(ui.from, i), 0);
  for (const m of sales) byDay.set(m.date, (byDay.get(m.date) || 0) + m.sum);
  const byStore = new Map(); for (const m of sales) byStore.set(m.store, (byStore.get(m.store) || 0) + m.sum);
  const stRows = [...byStore].sort((a, b) => b[1] - a[1]); const maxS = Math.max(1, ...stRows.map(x => x[1]));

  low.sort((a, b) => (a.q / a.mn) - (b.q / b.mn));

    <div class="card kpi"><div class="l">Товар на остатках</div><div class="v">${money0(stockVal)} ₴</div><div class="s">по себестоимости, вся сеть</div></div>

function lineChart(pts){
  if (!pts.length) return "";
  const W = 640, H = 200, pl = 52, pr = 12, pt = 12, pb = 26;
  const max = Math.max(...pts.map(p => p[1]), 1);
  const step = Math.pow(10, Math.floor(Math.log10(max))); let top = Math.ceil(max / step) * step; if (top / step > 6) top = Math.ceil(max / (step * 2)) * step * 2;
  const x = i => pl + (pts.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (pts.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  const ticks = [0, top / 2, top];
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const area = line + `L${x(pts.length - 1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z`;
  const every = Math.max(1, Math.ceil(pts.length / 7));
  const last = pts.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Выручка по дням">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end">${money0(t)}</text>`).join("")}
    <path d="${area}" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p, i) => (i % every === 0 || i === last) && (i === last || last - i >= every / 2) ? `<text x="${x(i)}" y="${H - 7}" text-anchor="middle">${p[0].slice(8, 10)}.${p[0].slice(5, 7)}</text>` : "").join("")}
    <circle cx="${x(last)}" cy="${y(pts[last][1])}" r="4" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>
  </svg>`;
}

  const t = type === "all" ? null : TYPES[type];
  let docs = S.docs.filter(d => (!t || d.type === type) && inPeriod(d.date));
  const isTr = type === "transfer";
  if (isTr) { if (ui.jFrom !== "all") docs = docs.filter(d => d.from === ui.jFrom); if (ui.jTo !== "all") docs = docs.filter(d => d.to === ui.jTo); }

  docs.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.created || 0) - (a.created || 0));
  const total = docs.reduce((a, d) => a + docTotal(d), 0);
  const create = (type === "sale" ? `<button class="btn" data-go="import">Загрузить из Checkbox</button>` : "") + (type === "receipt" && canWrite ? `<label class="btn">Поступление с фото накладной<input type="file" id="photofile" accept="image/*" multiple hidden></label>` : "") + (t ? `<button class="btn pri" data-new="${type}" ${canWrite ? "" : "disabled"}>Создать: ${t.short.toLowerCase()}</button>`

  lastTable = {name: t ? t.plural : "Журнал документов", head:["Дата","Номер","Вид","Статус","Откуда / куда","Поставщик","Сумма","Комментарий"],

/* ---- markups by group ---- */
function vMarkups(){
  const M = markups();
  if (!ui.mkDraft) ui.mkDraft = {};
  const draft = ui.mkDraft, sales = salesIn("all");
  const agg = new Map();
  for (const g of groups()) agg.set(gkey(g), {n: 0, rev: 0, cogs: 0, costItems: 0});
  for (const it of S.items) { const a = agg.get(gkey(it.group)); if (a) a.n++; }
  const L0 = ledger();
  for (const m of sales) { const g = gkey(itemOf(m.item)?.group); const a = agg.get(g) || {n:0, rev:0, cogs:0}; a.rev += m.sum; if (m.src === "cost") a.cogs += m.cogs, a.costRev = (a.costRev || 0) + m.sum; agg.set(g, a); }
  const rows = [...agg].map(([g, a]) => { const mk = draft[g] !== undefined ? draft[g] : (M[g] ?? ""); const m = mk === "" ? null : num(mk);
    const markupRev = a.rev - (a.costRev || 0); const cogs = a.cogs + (m !== null ? markupRev / (1 + m / 100) : 0); return {g, a, mk, m, cogs, inc: a.rev - cogs}; })
    .sort((x, y) => y.a.rev - x.a.rev || x.g.localeCompare(y.g, "ru"));
  const T = rows.reduce((t, r) => ({rev: t.rev + r.a.rev, cogs: t.cogs + r.cogs}), {rev: 0, cogs: 0});
  const dirty = Object.keys(draft).length > 0, missing = rows.filter(r => r.m === null && r.a.rev > 0).length;
  lastTable = {name: "Наценки по группам", head: ["Группа", "Товаров", "Выручка", "Наценка %", "Себестоимость", "Доход", "Маржа %"],
    rows: rows.map(r => [r.g, r.a.n, r2(r.a.rev), r.m ?? "", r2(r.cogs), r2(r.inc), r.a.rev ? r2(r.inc / r.a.rev * 100) : ""])};
  return top("Наценки по группам", `Себестоимость = выручка / (1 + наценка). Применяется к товарам без закупочной цены · период ${dfmt(ui.from)} — ${dfmt(ui.to)}`,
    `<button class="btn" data-act="mk-reset" ${dirty ? "" : "disabled"}>Отменить</button><button class="btn pri" data-act="mk-save" ${canWrite && dirty ? "" : "disabled"}>Сохранить наценки</button>` + csvBtn()) + `
  <div class="filters">${periodCtl()}${missing ? ` <span class="warn hint">Не задана наценка у ${missing} групп с продажами — по ним прибыль считается равной выручке.</span>` : ""}</div>
  <div class="tbl"><table><thead><tr><th>Группа</th><th class="n">Товаров</th><th class="n">Выручка, ₴</th><th class="n">Наценка, %</th><th class="n">Себестоимость, ₴</th><th class="n">Доход, ₴</th><th class="n">Маржа</th></tr></thead><tbody>
  ${rows.map((r, i) => `<tr><td><b>${esc(r.g)}</b>${draft[r.g] !== undefined ? ` <span class="pill b">изменено</span>` : ""}</td><td class="n">${r.a.n}</td><td class="n">${money(r.a.rev)}</td>
    <td class="n"><input class="q" style="max-width:90px;text-align:right" type="number" step="0.1" min="0" id="mk_${i}" data-mkg="${esc(r.g)}" value="${esc(r.mk)}" placeholder="—" aria-label="Наценка ${esc(r.g)}" ${canWrite ? "" : "disabled"}></td>
    <td class="n muted">${money(r.cogs)}</td><td class="n">${money(r.inc)}</td><td class="n ${r.m === null && r.a.rev ? "warn" : ""}">${r.a.rev ? pct(r.inc / r.a.rev * 100) : "—"}</td></tr>`).join("")}
  <tr class="tot"><td>Итого</td><td></td><td class="n">${money(T.rev)}</td><td></td><td class="n">${money(T.cogs)}</td><td class="n">${money(T.rev - T.cogs)}</td><td class="n">${pct(T.rev ? (T.rev - T.cogs) / T.rev * 100 : NaN)}</td></tr>
  </tbody></table></div>
  <div class="hint" style="margin-top:8px">Если у товара есть закупочная цена (из поступлений или в карточке товара), прибыль считается по ней, а наценка группы не используется. Изменение наценки сразу пересчитывает прибыль во всех отчётах.</div>`;
}

/* ---- report: stock ---- */
function itemSuppliers(){
  const m = new Map(), add = (i, sp) => { if (!sp) return; if (!m.has(i)) m.set(i, new Set()); m.get(i).add(sp); };
  for (const it of S.items) add(it.id, it.supplier);
  for (const d of S.docs) if (d.type === "receipt" && d.posted) for (const l of d.lines || []) add(l.item, d.supplier);
  return m;
}
function vStock(){
  const L0 = ledger(), allStores = sortedStores();
  const stores = ui.stockStore === "all" ? allStores : allStores.filter(s => s.id === ui.stockStore);
  const sup = itemSuppliers(), words = srchNorm(ui.stockSearch).split(" ").filter(Boolean);
  let items = sortedItems();
  if (ui.stockGroup !== "all") items = items.filter(i => (i.group || "Без группы") === ui.stockGroup);
  if (ui.stockSupp === "none") items = items.filter(i => !sup.has(i.id));
  else if (ui.stockSupp !== "all") items = items.filter(i => sup.get(i.id)?.has(ui.stockSupp));
  if (words.length) items = items.filter(i => { const h = srchNorm(i.name) + " " + String(i.cbCode || "") + " " + String(i.barcode || ""); return words.every(w => h.includes(w)); });
  const val = (it, q) => ui.stockMode === "qty" ? q : ui.stockMode === "cost" ? q * (L0.avg.get(it.id) || 0) : q * (+it.price || 0);
  const f = ui.stockMode === "qty" ? qtyf : money;
  const qmin = ui.stockQmin === "" ? null : num(ui.stockQmin), qmax = ui.stockQmax === "" ? null : num(ui.stockQmax);
  const rows = []; const tot = stores.map(() => 0); let gt = 0;
  for (const it of items) {
    const qs = stores.map(s => stockOf(s.id, it.id)), qt = qs.reduce((a, b) => a + b, 0), z = x => Math.abs(x) < 1e-9;
    const mn = +it.min || 0;
    const c = ui.stockQty;
    if (c === "nonzero" && qs.every(z)) continue;
    if (c === "pos" && !(qt > 1e-9)) continue;
    if (c === "zero" && !z(qt)) continue;
    if (c === "neg" && !(qt < -1e-9)) continue;
    if (c === "low" && !(mn && stores.some(s => s.kind !== "warehouse" && stockOf(s.id, it.id) < mn))) continue;
    if (qmin !== null && qt < qmin - 1e-9) continue;
    if (qmax !== null && qt > qmax + 1e-9) continue;
    const vs = qs.map(q => val(it, q)); const t = vs.reduce((a, b) => a + b, 0);
    vs.forEach((v, i) => tot[i] += v); gt += t;
    rows.push({it, qs, vs, t});
  }
  const one = stores.length === 1;
  lastTable = {name:"Остатки товаров", head:["Товар","Группа","Ед.","Поставщик", ...stores.map(s => s.name), ...(one ? [] : ["Итого"])],
    rows: rows.map(r => [r.it.name, r.it.group, r.it.unit, [...(sup.get(r.it.id) || [])].map(suppName).join(", "), ...r.vs.map(r2), ...(one ? [] : [r2(r.t)])])};
  const modeName = {qty:"количество", cost:"сумма по себестоимости, ₴", price:"сумма в розничных ценах, ₴"}[ui.stockMode];
  const active = ui.stockStore !== "all" || ui.stockGroup !== "all" || ui.stockSupp !== "all" || ui.stockSearch || ui.stockQty !== "nonzero" || ui.stockQmin !== "" || ui.stockQmax !== "";
  const supList = sortedBy("suppliers");
  return top("Остатки товаров", `На текущий момент · ${modeName} · найдено ${rows.length} из ${S.items.length} товаров`, csvBtn()) + `
  <div class="filters"><div class="seg">${[["qty","Количество"],["cost","Себестоимость"],["price","Розница"]].map(([k, n]) => `<button data-smode="${k}" class="${ui.stockMode === k ? "on" : ""}">${n}</button>`).join("")}</div></div>
  <div class="card pad" style="margin-bottom:12px"><div class="fgrid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end">
    <label>Наименование<input type="search" id="ssearch" placeholder="Название, код, штрихкод" value="${esc(ui.stockSearch)}"></label>
    <label>Магазин / склад<select id="sstore"><option value="all">Все точки</option>${allStores.map(x => `<option value="${x.id}" ${x.id === ui.stockStore ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
    <label>Группа<select id="sgroup"><option value="all">Все группы</option>${groups().map(g => `<option ${g === ui.stockGroup ? "selected" : ""}>${esc(g)}</option>`).join("")}</select></label>
    <label>Поставщик<select id="ssupp"><option value="all">Все поставщики</option>${supList.map(x => `<option value="${x.id}" ${x.id === ui.stockSupp ? "selected" : ""}>${esc(x.name)}</option>`).join("")}<option value="none" ${ui.stockSupp === "none" ? "selected" : ""}>Без поставщика</option></select></label>
    <label>Количество<select id="sqty">${[["nonzero","Все с движением"],["all","Все товары, включая нулевые"],["pos","Есть в наличии (> 0)"],["zero","Нет в наличии (= 0)"],["neg","Отрицательные (< 0)"],["low","Ниже минимального остатка"]].map(([k, n]) => `<option value="${k}" ${ui.stockQty === k ? "selected" : ""}>${n}</option>`).join("")}</select></label>
    <label>Остаток от<input type="number" step="0.001" id="sqmin" value="${esc(ui.stockQmin)}" placeholder="—"></label>
    <label>Остаток до<input type="number" step="0.001" id="sqmax" value="${esc(ui.stockQmax)}" placeholder="—"></label>
    <div><button class="btn" data-e="stock-reset" ${active ? "" : "disabled"}>Сбросить фильтры</button></div>
  </div>${!supList.length ? `<div class="hint" style="margin-top:8px">Поставщиков пока нет. Поставщик товара берётся из проведённых поступлений или из поля «Основной поставщик» в карточке товара.</div>` : ""}
  <div class="hint" style="margin-top:6px">Фильтр по количеству и «от / до» считаются по ${one ? "выбранной точке" : "сумме всех точек"}.</div></div>
  ${rows.length ? `<div class="tbl"><table><thead><tr><th>Товар</th><th>Ед.</th>${stores.map(s => `<th class="n">${esc(s.name)}</th>`).join("")}${one ? "" : `<th class="n">Итого</th>`}</tr></thead><tbody>
  ${rows.map(r => `<tr><td><b>${esc(r.it.name)}</b> <span class="muted">· ${esc(r.it.group || "")}${sup.has(r.it.id) ? " · " + esc([...sup.get(r.it.id)].map(suppName).join(", ")) : ""}</span></td><td>${esc(r.it.unit || "")}</td>${r.vs.map((v, i) => { const q = r.qs[i], mn = +r.it.min || 0, s = stores[i];
      const cls = q < -1e-9 ? "neg" : (s.kind !== "warehouse" && mn && q < mn) ? "warn" : Math.abs(q) < 1e-9 ? "muted" : "";
      return `<td class="n ${cls}">${Math.abs(q) < 1e-9 ? "·" : f(v)}</td>`; }).join("")}${one ? "" : `<td class="n"><b>${f(r.t)}</b></td>`}</tr>`).join("")}
  <tr class="tot"><td colspan="2">Итого</td>${tot.map(t => `<td class="n">${f(t)}</td>`).join("")}${one ? "" : `<td class="n">${f(gt)}</td>`}</tr>
  </tbody></table></div><div class="hint" style="margin-top:8px"><span class="neg">Красным</span> — отрицательный остаток (продано больше, чем пришло), <span class="warn">оранжевым</span> — ниже минимального остатка.</div>`
  : `<div class="card"><div class="empty"><b>${active ? "По фильтрам ничего не найдено" : "Остатков нет"}</b>${active ? "Измените условия или нажмите «Сбросить фильтры»." : "Проведите поступление товара на склад или в магазин."}</div></div>`}`;
}

/* ---- report: sales ---- */
function vSales(){
  const sales = salesIn(ui.salesStore);
  const key = m => ui.salesBy === "store" ? m.store : ui.salesBy === "group" ? (itemOf(m.item)?.group || "Без группы") : ui.salesBy === "day" ? m.date : m.item;
  const label = k => ui.salesBy === "store" ? storeName(k) : ui.salesBy === "group" ? k : ui.salesBy === "day" ? dfmt(k) : (itemOf(k)?.name || "—");
  const agg = new Map();
  for (const m of sales) { const k = key(m); const a = agg.get(k) || {q:0, sum:0, cogs:0, n:new Set()}; a.q += -m.q; a.sum += m.sum; a.cogs += m.cogs; a.n.add(m.doc.id); agg.set(k, a); }
  let rows = [...agg].map(([k, a]) => ({k, ...a}));
  if (ui.salesBy === "day") rows.sort((a, b) => a.k < b.k ? -1 : 1); else rows.sort((a, b) => b.sum - a.sum);
  const T = rows.reduce((t, r) => ({q:t.q + r.q, sum:t.sum + r.sum, cogs:t.cogs + r.cogs}), {q:0, sum:0, cogs:0});
  const showQty = ui.salesBy === "item";
  const colName = {store:"Точка", group:"Группа", item:"Товар", day:"День"}[ui.salesBy];
  lastTable = {name:"Продажи " + dfmt(ui.from) + "-" + dfmt(ui.to), head:[colName, ...(showQty ? ["Кол-во"] : []), "Выручка","Себестоимость","Прибыль","Маржа %","Доля %"],
    rows: rows.map(r => [label(r.k), ...(showQty ? [r2(r.q)] : []), r2(r.sum), r2(r.cogs), r2(r.sum - r.cogs), r.sum ? r2((r.sum - r.cogs) / r.sum * 100) : 0, T.sum ? r2(r.sum / T.sum * 100) : 0])};

/* ---- report: ABC ---- */
function vAbc(){
  const sales = salesIn(ui.abcStore);
  const agg = new Map();
  for (const m of sales) { const a = agg.get(m.item) || {q:0, sum:0, cogs:0}; a.q += -m.q; a.sum += m.sum; a.cogs += m.cogs; agg.set(m.item, a); }
  const metric = r => ui.abcBy === "sum" ? r.sum : r.sum - r.cogs;
  const rows = [...agg].map(([k, a]) => ({k, ...a, v: 0})).map(r => (r.v = metric(r), r)).sort((a, b) => b.v - a.v);
  const T = rows.reduce((t, r) => t + Math.max(0, r.v), 0); let cum = 0;
  for (const r of rows) { const before = T ? cum / T * 100 : 100; cum += Math.max(0, r.v); r.cum = T ? cum / T * 100 : 0; r.cls = before < 80 ? "A" : before < 95 ? "B" : "C"; }
  const cnt = {A:0, B:0, C:0}, sumc = {A:0, B:0, C:0}; rows.forEach(r => { cnt[r.cls]++; sumc[r.cls] += r.v; });
  const unsold = S.items.filter(i => !agg.has(i.id));
  lastTable = {name:"ABC-анализ", head:["Класс","Товар","Группа","Кол-во","Выручка","Прибыль","Доля %","Накопл. %"],
    rows: rows.map(r => [r.cls, itemOf(r.k)?.name, itemOf(r.k)?.group, r2(r.q), r2(r.sum), r2(r.sum - r.cogs), T ? r2(r.v / T * 100) : 0, r2(r.cum)])};
  return top("ABC-анализ", `Период: ${dfmt(ui.from)} — ${dfmt(ui.to)} · A — первые 80%, B — до 95%, C — остальное`, csvBtn()) + `
  <div class="filters">${periodCtl()} ${storeSelect("astore", ui.abcStore, true, true)}
  <div class="seg">${[["sum","По выручке"],["profit","По прибыли"]].map(([k, n]) => `<button data-abc="${k}" class="${ui.abcBy === k ? "on" : ""}">${n}</button>`).join("")}</div></div>
  <div class="kpis">${["A","B","C"].map(c => `<div class="card kpi"><div class="l"><span class="pill ${c.toLowerCase()}">Класс ${c}</span></div><div class="v">${cnt[c]} поз.</div><div class="s">${money0(sumc[c])} ₴ · ${pct(T ? sumc[c] / T * 100 : NaN)}</div></div>`).join("")}
  <div class="card kpi"><div class="l">Без продаж</div><div class="v ${unsold.length ? "warn" : ""}">${unsold.length} поз.</div><div class="s">кандидаты на вывод из ассортимента</div></div></div>
  ${rows.length ? `<div class="tbl"><table><thead><tr><th>Класс</th><th>Товар</th><th>Группа</th><th class="n">Кол-во</th><th class="n">Выручка, ₴</th><th class="n">Прибыль, ₴</th><th class="n">Доля</th><th class="n">Накопленная</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td><span class="pill ${r.cls.toLowerCase()}">${r.cls}</span></td><td><b>${esc(itemOf(r.k)?.name || "—")}</b></td><td>${esc(itemOf(r.k)?.group || "")}</td><td class="n">${qtyf(r.q)} ${esc(itemOf(r.k)?.unit || "")}</td><td class="n">${money(r.sum)}</td><td class="n">${money(r.sum - r.cogs)}</td><td class="n">${pct(T ? r.v / T * 100 : NaN)}</td><td class="n muted">${pct(r.cum)}</td></tr>`).join("")}
  ${unsold.map(i => `<tr><td><span class="pill draft">—</span></td><td>${esc(i.name)}</td><td>${esc(i.group || "")}</td><td class="n muted" colspan="5">нет продаж за период</td></tr>`).join("")}
  </tbody></table></div>` : `<div class="card"><div class="empty"><b>Продаж за период нет</b>Выберите другой период или точку.</div></div>`}`;

/* ---- report: suppliers ---- */
function vSupp(){

  const T = rows.reduce((t, r) => ({o:t.o + r.o, inc:t.inc + r.inc, paid:t.paid + r.paid, c:t.c + r.c}), {o:0, inc:0, paid:0, c:0});

/* ---------- modals ---------- */
function openModal(html){ const m = $("#modal"); m.innerHTML = html; m.hidden = false; const f = m.querySelector("[autofocus]"); if (f) f.focus(); }
function closeModal(){ $("#modal").hidden = true; $("#modal").innerHTML = ""; edit = null; }

function openDoc(d){
  if (ERP_TYPES[d.type]) { edit = JSON.parse(JSON.stringify(d)); edit._kind = "doc"; edit._arm = false; if (d.type === "payroll" && !Array.isArray(edit.lines)) edit.lines = []; return erpRender(); }
  edit = JSON.parse(JSON.stringify(d)); edit._kind = "doc"; edit._arm = false;
  if (!Array.isArray(edit.lines)) edit.lines = [];
  renderDoc();
}
function newDoc(type){
  if (ERP_TYPES[type]) return erpNewDoc(type);
  const st = sortedStores(), wh = st.find(s => s.kind === "warehouse") || st[0], r0 = retail()[0] || st[0];
  const d = {id: uid("d"), type, num: nextNum(type), date: today(), posted: false, created: Date.now(), lines: [], note: ""};
  if (type === "receipt") { d.to = wh?.id; d.supplier = S.suppliers[0]?.id || ""; }
  if (type === "transfer") { d.from = wh?.id; d.to = r0?.id; }
  if (type === "sale" || type === "writeoff" || type === "inventory") d.from = r0?.id;
  if (type === "writeoff") d.reason = WO_REASONS[0];
  if (type === "payment") { d.supplier = S.suppliers[0]?.id || ""; d.amount = 0; delete d.lines; }
  if (d.lines) d.lines.push({item:"", qty:"", price:""});
  edit = d; edit._kind = "doc"; edit._new = true; renderDoc();
}
function itemOptions(sel){
  let h = `<option value="">— выберите товар —</option>`, g = null;
  for (const it of sortedItems()) { if (it.group !== g) { if (g !== null) h += `</optgroup>`; g = it.group; h += `<optgroup label="${esc(g || "Без группы")}">`; } h += `<option value="${it.id}" ${it.id === sel ? "selected" : ""}>${esc(it.name)}</option>`; }

function suppOptions(sel){ return `<option value="">— поставщик —</option>` + S.suppliers.map(s => `<option value="${s.id}" ${s.id === sel ? "selected" : ""}>${esc(s.name)}</option>`).join(""); }
function stOptions(sel){ return sortedStores().map(s => `<option value="${s.id}" ${s.id === sel ? "selected" : ""}>${esc(s.name)}${s.kind === "warehouse" ? " (склад)" : ""}</option>`).join(""); }

function lineSum(d, l){
  if (d.type === "sale" && l.sum !== undefined && l.sum !== "") return +l.sum;
  if (d.type === "receipt" || d.type === "sale") return (num(l.qty)) * (num(l.price));
  if (d.type === "inventory") return (num(l.fact) - stockOf(d.from, l.item));
  return num(l.qty) * (itemOf(l.item)?.price || 0);
}

function orgOfStore(store, date){
  let best = null;
  for (const o of S.owners) if (o.store === store && (o.from || "") <= date && (!best || (o.from || "") > (best.from || ""))) best = o;

}

/* ---------- money register ---------- */
function moneyMoves(){
  const out = [];
  for (const d of S.docs) {
    if (!d.posted) continue;
    const a = +d.amount || 0; if (!a) continue;
    if (d.type === "expense" && d.account) out.push({date:d.date, acc:d.account, amt:-a, doc:d, what: artName(d.article)});
    else if (d.type === "payment" && d.account) out.push({date:d.date, acc:d.account, amt:-a, doc:d, what: "Оплата: " + suppName(d.supplier)});
    else if (d.type === "money") {
      if (d.op === "transfer") { if (d.accFrom) out.push({date:d.date, acc:d.accFrom, amt:-a, doc:d, what:"Перемещение → " + accName(d.accTo)}); if (d.accTo) out.push({date:d.date, acc:d.accTo, amt:a, doc:d, what:"Перемещение ← " + accName(d.accFrom)}); }
      else if (d.accTo) out.push({date:d.date, acc:d.accTo, amt:a, doc:d, what: d.source || "Поступление"});
    }
  }
  return out.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
}

      const rev = sales.get(sd.store + "|" + date) || 0, share = rev / ids.length;
      base += share;
      const bs = byStore[sd.store] = byStore[sd.store] || {shifts:0, base:0}; bs.shifts++; bs.base += share;
    }
  }
  const rate = num(emp.perShift), p = num(emp.pct), sal = num(emp.salary);
  return {shifts, base, shiftPay: shifts * rate, pctPay: base * p / 100, salary: sal, byStore};
}
/* salary cost by store (and "" for общие) for a date range: posted payroll if present for the month, else estimate from schedule */
function salaryCost(from, to){
  const res = new Map(), add = (s, v) => res.set(s || "", (res.get(s || "") || 0) + v);
  let estimated = false;
  const months = new Set(); for (let d = from; d <= to; d = addDays(d, 1)) months.add(ym(d));
  const sales = dailyStoreSales();
  for (const m of months) {
    const dim = daysIn(m), first = m + "-01", last = m + "-" + String(dim).padStart(2, "0");
    const a = from > first ? from : first, b = to < last ? to : last;
    const frac = (Math.round((new Date(b) - new Date(a)) / 864e5) + 1) / dim;
    const pr = S.docs.filter(d => d.type === "payroll" && d.posted && d.month === m);
    if (pr.length) { for (const d of pr) for (const l of d.lines || []) { const acc = num(l.accrued); const split = l.split && Object.keys(l.split).length ? l.split : {[l.store || ""]: 1}; for (const [s, w] of Object.entries(split)) add(s, acc * w * frac); } }
    else {
      for (const e of S.employees) {
        if (e.active === "no") continue;
        const c = calcPay(e, m, sales); let any = false;
        // shift-based part: by actual shift days inside [a,b]
        for (const sd of S.shifts) if (sd.month === m) for (const [day, ids] of Object.entries(sd.days || {})) {
          const date = m + "-" + day; if (date < a || date > b || !ids.includes(e.id)) continue;
          any = true; const rev = sales.get(sd.store + "|" + date) || 0;
          add(sd.store, num(e.perShift) + rev / ids.length * num(e.pct) / 100);
        }
        if (num(e.salary)) { add(e.store || "", num(e.salary) * frac); any = true; }
        if (any) estimated = true;
      }
    }
  }
  return {byStore: res, estimated};
}
function expensesIn(from, to){
  return S.docs.filter(d => d.type === "expense" && d.posted && d.date >= from && d.date <= to && byId("articles", d.article)?.kind !== "nopl");
}

/* ---------- P&L by store ---------- */
function pnl(from, to, orgFilter, spread){
  const stores = retail().filter(s => !orgFilter || orgFilter === "all" || orgOfStore(s.id, to) === orgFilter);
  const ids = new Set(stores.map(s => s.id));
  const rows = new Map(stores.map(s => [s.id, {s, rev:0, cogs:0, sal:0, exp:0, common:0}]));
  for (const m of ledger().moves) if (m.type === "sale" && m.date >= from && m.date <= to && rows.has(m.store)) { const r = rows.get(m.store); r.rev += m.sum; r.cogs += m.cogs; }
  for (const m of ledger().moves) if (m.type === "writeoff" && m.date >= from && m.date <= to && rows.has(m.store)) rows.get(m.store).cogs += m.cogs;
  const sc = salaryCost(from, to);
  let commonSal = 0, commonExp = 0; const byArt = new Map();
  for (const [s, v] of sc.byStore) { if (rows.has(s)) rows.get(s).sal += v; else if (!s) commonSal += v; }
  for (const d of expensesIn(from, to)) {
    if (orgFilter && orgFilter !== "all" && d.org && d.org !== orgFilter && !(d.store && ids.has(d.store))) continue;
    const a = num(d.amount); byArt.set(d.article, (byArt.get(d.article) || 0) + a);
    if (d.store && rows.has(d.store)) rows.get(d.store).exp += a; else if (!d.store) commonExp += a;
  }
  const totRev = [...rows.values()].reduce((t, r) => t + r.rev, 0);
  if (spread) for (const r of rows.values()) r.common = totRev ? (commonSal + commonExp) * r.rev / totRev : 0;
  for (const r of rows.values()) { r.gross = r.rev - r.cogs; r.net = r.gross - r.sal - r.exp - r.common; }
  return {rows: [...rows.values()].sort((a, b) => b.rev - a.rev), commonSal, commonExp, byArt, estimated: sc.estimated};
}

function payLine(l){
  const n = k => num(l[k]);
  const accrued = r2(n("shiftPay") + n("pctPay") + n("salary") + n("bonus") - n("fine"));
  return Object.assign({}, l, {accrued, toPay: r2(accrued - n("advance"))});
}
function fillPayroll(){
  const m = edit.month, sales = dailyStoreSales(), keep = new Map((edit.lines || []).map(l => [l.emp, l]));
  edit.lines = [];
  for (const e of activeEmps()) {
    const c = calcPay(e, m, sales);
    if (!c.shifts && !num(e.salary)) continue;
    const old = keep.get(e.id) || {};
    const split = {}; const tot = Object.values(c.byStore).reduce((t, x) => t + x.shifts, 0);
    if (tot) for (const [s, x] of Object.entries(c.byStore)) split[s] = x.shifts / tot; else split[e.store || ""] = 1;
    edit.lines.push(payLine({emp: e.id, store: e.store || "", shifts: c.shifts, rate: num(e.perShift), shiftPay: r2(c.shiftPay), base: r2(c.base), pct: num(e.pct), pctPay: r2(c.pctPay), salary: num(e.salary), bonus: old.bonus ?? "", fine: old.fine ?? "", advance: old.advance ?? "", split}));
  }
  if (!edit.lines.length) toast("За " + monthName(m) + " нет смен в графике и нет сотрудников с окладом.", "neg");
  payrollRender();
}

function vDirector(){
  const len = Math.round((new Date(ui.to) - new Date(ui.from)) / 864e5) + 1, pf = addDays(ui.from, -len), pt = addDays(ui.from, -1);
  const P = pnl(ui.from, ui.to, "all", true), Pp = pnl(pf, pt, "all", true);
  const sum = (X, k) => X.rows.reduce((t, r) => t + r[k], 0);
  const rev = sum(P, "rev"), gross = sum(P, "gross"), net = sum(P, "net"), sal = sum(P, "sal") + P.commonSal, exp = sum(P, "exp") + P.commonExp;
  const prevRev = sum(Pp, "rev"), prevNet = sum(Pp, "net");
  const delta = (a, b) => b ? ((a - b) / Math.abs(b) * 100) : NaN;
  const chip = v => isFinite(v) ? `<span class="pill ${v >= 0 ? "ok" : "c"}">${v >= 0 ? "▲" : "▼"} ${pct(Math.abs(v))}</span>` : `<span class="pill draft">нет данных</span>`;
  const bal = balances(); let cash = 0; for (const v of bal.values()) cash += v;
  let debt = 0; for (const v of debtNow().values()) debt += v;
  const prev = new Map(Pp.rows.map(r => [r.s.id, r]));
  const maxRev = Math.max(1, ...P.rows.map(r => r.rev));
  const arts = [...P.byArt].sort((a, b) => b[1] - a[1]).slice(0, 6);
  return top("Панель директора", `${dfmt(ui.from)} — ${dfmt(ui.to)} · сравнение с ${dfmt(pf)} — ${dfmt(pt)}`, periodCtl()) + `
  <div class="kpis">
    <div class="card kpi"><div class="l">Выручка</div><div class="v">${money0(rev)} ₴</div><div class="s">${chip(delta(rev, prevRev))} к прошлому периоду</div></div>
    <div class="card kpi"><div class="l">Валовая прибыль</div><div class="v">${money0(gross)} ₴</div><div class="s">маржа ${pct(rev ? gross / rev * 100 : NaN)}</div></div>
    <div class="card kpi"><div class="l">Чистая прибыль</div><div class="v ${net < 0 ? "neg" : ""}">${money0(net)} ₴</div><div class="s">${chip(delta(net, prevNet))} · рентабельность ${pct(rev ? net / rev * 100 : NaN)}</div></div>
    <div class="card kpi"><div class="l">Зарплата и расходы</div><div class="v">${money0(sal + exp)} ₴</div><div class="s">ЗП ${money0(sal)} · расходы ${money0(exp)}${P.estimated ? " · ЗП по графику" : ""}</div></div>
  </div>
  <div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    <div class="card kpi"><div class="l">Деньги на кассах и счетах сейчас</div><div class="v">${money0(cash)} ₴</div><div class="s"><a href="#" data-go="r-money" style="color:var(--accent)">Денежные средства</a></div></div>
    <div class="card kpi"><div class="l">Долг поставщикам</div><div class="v ${debt > 0 ? "warn" : ""}">${money0(debt)} ₴</div><div class="s"><a href="#" data-go="r-supp" style="color:var(--accent)">Расчёты с поставщиками</a></div></div>
  </div>
  <div class="grid2"><div class="card"><h3>Точки: выручка и чистая прибыль</h3><div class="pad"><div class="tbl" style="border:0"><table><thead><tr><th>Точка</th><th>Выручка</th><th class="n">Чистая</th><th class="n">Рентаб.</th><th class="n">Выручка к прошлому</th></tr></thead><tbody>
    ${P.rows.map(r => { const p = prev.get(r.s.id); return `<tr><td><b>${esc(r.s.name)}</b></td><td style="min-width:140px"><span class="share" style="width:90px"><i style="width:${(r.rev / maxRev * 100).toFixed(1)}%"></i></span><span class="num">${money0(r.rev)}</span></td><td class="n ${r.net < 0 ? "neg" : "pos"}">${money0(r.net)}</td><td class="n">${pct(r.rev ? r.net / r.rev * 100 : NaN)}</td><td class="n">${chip(delta(r.rev, p?.rev || 0))}</td></tr>`; }).join("")}
    </tbody></table></div></div></div>
  <div class="card"><h3>Крупнейшие расходы</h3><div class="pad list">${arts.length ? arts.map(([a, v]) => `<div class="row" data-go="r-pnl"><span>${esc(artName(a))}</span><span class="num">${money0(v)} ₴</span></div>`).join("") : `<div class="muted">Расходов за период нет.</div>`}
    <div class="row" data-go="r-pnl"><span><b>Зарплата</b></span><span class="num">${money0(sal)} ₴</span></div></div></div></div>`;
}

  for (const it of S.items) {
    const name = srchNorm(it.name), code = String(it.cbCode || ""), bar = String(it.barcode || "");
    if (code === t || (bar && bar === t)) { out.push([0, it]); continue; }

    const [i, f] = t.dataset.l.split(":"); const l = edit.lines[+i];
    if (f === "item") {
      l.item = t.value; const it = itemOf(t.value);
      if (it) { if (edit.type === "receipt") l.price = it.buy; if (edit.type === "sale") l.price = it.price; if (edit.type === "inventory" && (l.fact === undefined || l.fact === "")) l.fact = r2(stockOf(edit.from, it.id)); }
      if (edit._arm) edit._arm = false;
      renderDoc(); const q = document.querySelector(`[data-l="${i}:${edit.type === "inventory" ? "fact" : "qty"}"]`); q?.focus(); return;
    }
    l[f] = t.value; if (f === "qty" || f === "price") delete l.sum; refreshDocSums(); return;
  }
  if (t.dataset.h && edit) {
    edit[t.dataset.h] = t.value;
    if (["from","to","date"].includes(t.dataset.h) && t.tagName === "SELECT") renderDoc(); else refreshDocSums();
    return;
  }
  if (t.dataset.r && edit) {
    edit[t.dataset.r] = t.type === "number" ? t.value : t.value;
    if (edit._kind === "item" && (t.dataset.r === "buy" || t.dataset.r === "price")) { const mk = num(edit.buy) ? (num(edit.price) - num(edit.buy)) / num(edit.buy) * 100 : NaN; const v = $("#mkview"); if (v) v.value = pct(mk); }
    return;
  }
  if (t.id === "fillgroup" && edit) {
    const g = t.value; if (!g) return; const have = new Set(edit.lines.map(l => l.item));
    edit.lines = edit.lines.filter(l => l.item);
    for (const it of sortedItems()) if ((it.group || "Без группы") === g && !have.has(it.id)) edit.lines.push({item:it.id, qty:"", price: edit.type === "receipt" ? it.buy : it.price, ...(edit.type === "inventory" ? {fact: r2(stockOf(edit.from, it.id))} : {})});
    renderDoc(); return;
  }
  if (t.dataset.mkg !== undefined) { (ui.mkDraft = ui.mkDraft || {})[t.dataset.mkg] = t.value; return; }
  const map = {jsearch:"jSearch", isearch:"itemSearch", ssearch:"stockSearch"};
  if (map[t.id]) { ui[map[t.id]] = t.value; const pos = t.selectionStart; render(); const n = document.getElementById(t.id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} } return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "pf" && t.value) { ui.from = t.value; if (ui.to < ui.from) ui.to = ui.from; render(); }
  else if (t.id === "pt" && t.value) { ui.to = t.value; if (ui.from > ui.to) ui.from = ui.to; render(); }
  else if (t.id === "jstore") { ui.jStore = t.value; render(); }
  else if (t.id === "jsupp") { ui.jSupp = t.value; render(); }
  else if (t.id === "jfrom") { ui.jFrom = t.value; render(); }
  else if (t.id === "jreason") { ui.jReason = t.value; render(); }
  else if (t.id === "jto") { ui.jTo = t.value; render(); }
  else if (t.id === "igroup") { ui.itemGroup = t.value; render(); }
  else if (t.id === "sgroup") { ui.stockGroup = t.value; render(); }
  else if (t.id === "sstore") { ui.stockStore = t.value; render(); }
  else if (t.id === "ssupp") { ui.stockSupp = t.value; render(); }
  else if (t.id === "sqty") { ui.stockQty = t.value; render(); }
  else if (t.id === "sqmin") { ui.stockQmin = t.value; render(); }
  else if (t.id === "sqmax") { ui.stockQmax = t.value; render(); }
  else if (t.id === "sstore") { ui.salesStore = t.value; render(); }
  else if (t.id === "astore") { ui.abcStore = t.value; render(); }
  else if (t.id === "citem") { ui.cardItem = t.value; render(); }
  else if (t.id === "cstore") { ui.cardStore = t.value; render(); }
  else if (t.dataset.h === "date" && edit) { edit.date = t.value; renderDoc(); }
  else if (t.dataset.mkg !== undefined) { render(); const n = document.getElementById(t.id); }
  else if (t.id === "restorefile" && t.files.length && window.localApi) {
    const f = t.files[0]; t.value = "";
    f.text().then(async txt => { let o; try { o = JSON.parse(txt); } catch (_) { toast("Это не файл резервной копии Учёт ТТ.", "neg"); return; }
      if (!o || !Array.isArray(o.items) || !Array.isArray(o.docs) || !Array.isArray(o.stores)) { toast("В файле нет товаров, точек и документов. Выберите резервную копию Учёт ТТ.", "neg"); return; }
      await window.localApi.replace(o); location.reload(); });
  }
  else if (t.id === "impfile" && t.files.length) { readImportFiles([...t.files]); t.value = ""; }
  else if (t.id === "photofile" && t.files.length) { const f = [...t.files].filter(x => /^image\//.test(x.type) || /\.(jpe?g|png|webp|gif|heic)$/i.test(x.name)); t.value = ""; if (!f.length) toast("Выберите фото накладной (JPG или PNG).", "neg"); else readPhotos(f); }
  else if (t.dataset.prro && imp) { imp.prros.get(t.dataset.prro).storeId = t.value; render(); }
});
document.addEventListener("dragover", e => { if (e.target.closest && e.target.closest("#dropzone")) { e.preventDefault(); e.target.closest("#dropzone").style.borderColor = "var(--accent)"; } });
document.addEventListener("dragleave", e => { const z = e.target.closest && e.target.closest("#dropzone"); if (z) z.style.borderColor = ""; });
document.addEventListener("drop", e => { const z = e.target.closest && e.target.closest("#dropzone"); if (!z) return; e.preventDefault(); z.style.borderColor = ""; if (e.dataTransfer.files.length) readImportFiles([...e.dataTransfer.files]); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden) closeModal(); });

/* ---------- boot ---------- */
(function initView(){
  const h = (location.hash || "").slice(1);
  const all = NAV.flatMap(g => g[1].map(x => x[0]));
  const v = all.find(k => k.replace(":", "-") === h);
  if (v) ui.view = v;
})();
async function boot(){
  renderRail();
  const C = window.claude;
  if (C && typeof C.use === "function") {
    C.use("sample").then(x => { smp = x; }, () => {});
    try { db = await C.use("db"); } catch (_) { db = null; }
    try { dl = await C.use("downloads"); } catch (_) { dl = null; }
    try { const u = await C.use("user"); if (u) { const w = await u.can("data.write"); if (w === false) canWrite = false; } } catch (_) {}
  }
  if (db) {
    mode = "db";
    for (const c of COLS) db.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => Object.assign({id: d.id}, d.data())); loaded.add(c); bump(); },
      err => { loaded.add(c); if (err && err.code === "revoked") { canWrite = false; } toast("Связь с базой прервана: " + (err && err.message || "") + ". Обновите страницу.", "neg"); bump(); });
    setTimeout(() => { if (loaded.size < COLS.length) { COLS.forEach(c => loaded.add(c)); toast("База отвечает медленно — показаны загруженные данные. Обновите страницу через минуту.", "neg"); bump(); } }, 15000);
  } else {
    mode = "local"; Object.assign(S, makeDemo([])); bump();
  }
}
boot();
})();
